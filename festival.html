<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deepawali Festival Special - Fireworks & Dhamaka</title>
<meta name="theme-color" content="#09090b">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
/* Festival Page Essential Styles */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}
body {
  background: radial-gradient(circle at center, #111827 0%, #030712 100%);
  color: #ffffff;
  min-height: 100vh;
  overflow: hidden;
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}
canvas {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 1;
  pointer-events: none;
}
.festival-content {
  position: relative;
  z-index: 10;
  text-align: center;
  padding: 20px;
  background: rgba(17, 24, 39, 0.75);
  backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, 0.1);
  border-radius: 20px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
  max-width: 600px;
  width: 90%;
  pointer-events: auto;
}
.festival-content h1 {
  font-size: 2.2rem;
  color: #fbbf24;
  margin-bottom: 10px;
  text-shadow: 0 0 15px rgba(251, 191, 36, 0.5);
}
.festival-content p {
  font-size: 1.05rem;
  color: #9ca3af;
  margin-bottom: 20px;
  line-height: 1.6;
}
.back-dash-btn {
  background: linear-gradient(135deg, #f59e0b, #d97706);
  color: #ffffff;
  border: none;
  padding: 12px 24px;
  border-radius: 10px;
  font-size: 1rem;
  font-weight: 600;
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
  box-shadow: 0 4px 15px rgba(245, 158, 11, 0.4);
  display: inline-flex;
  align-items: center;
  gap: 8px;
  text-decoration: none;
}
.back-dash-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(245, 158, 11, 0.6);
}
.click-hint {
  position: absolute;
  bottom: 25px;
  z-index: 10;
  color: #f3f4f6;
  background: rgba(0, 0, 0, 0.6);
  padding: 8px 16px;
  border-radius: 30px;
  font-size: 0.9rem;
  border: 1px solid rgba(255, 255, 255, 0.15);
  letter-spacing: 0.5px;
  animation: pulseHint 2s infinite;
}
@keyframes pulseHint {
  0%, 100% { opacity: 0.7; }
  50% { opacity: 1; }
}
</style>
</head>
<body>

<!-- Fireworks Canvas Layer -->
<canvas id="fireworksCanvas"></canvas>

<!-- Center Greetings Box -->
<div class="festival-content">
  <h1><i class="fa-solid fa-fireworks"></i> Happy Deepawali! <i class="fa-solid fa-fireworks"></i></h1>
  <p>Aapko aur aapke poore parivar ko Deepawali ki dher saari shubhkaamnayein! Screen par kahin bhi click karein aur aasmaan mein dhamake aur patakhe phhote hue dekhein! 🎇</p>
  <a href="index.html" class="back-dash-btn"><i class="fa-solid fa-arrow-left"></i> Back to Dashboard</a>
</div>

<!-- Bottom Click Instruction -->
<div class="click-hint"><i class="fa-solid fa-hand-pointer"></i> Touch ya Click karein aasmaan mein patakha phodne ke liye!</div>

<script>
// Canvas Fireworks Animation Engine
const canvas = document.getElementById('fireworksCanvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

class Particle {
  constructor(x, y, color) {
    this.x = x;
    this.y = y;
    this.color = color;
    const angle = Math.random() * Math.PI * 2;
    const speed = Math.random() * 6 + 2;
    this.vx = Math.cos(angle) * speed;
    this.vy = Math.sin(angle) * speed;
    this.alpha = 1;
    this.friction = 0.96;
    this.gravity = 0.12;
    this.decay = Math.random() * 0.015 + 0.01;
  }
  update() {
    this.vx *= this.friction;
    this.vy *= this.friction;
    this.vy += this.gravity;
    this.x += this.vx;
    this.y += this.vy;
    this.alpha -= this.decay;
  }
  draw() {
    ctx.save();
    ctx.globalAlpha = this.alpha;
    ctx.beginPath();
    ctx.arc(this.x, this.y, 2.5, 0, Math.PI * 2);
    ctx.fillStyle = this.color;
    ctx.shadowBlur = 10;
    ctx.shadowColor = this.color;
    ctx.fill();
    ctx.restore();
  }
}

class Firework {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.particles = [];
    const colors = ['#ff4b2b', '#ff416c', '#fbbf24', '#38bdf8', '#a855f7', '#ec4899', '#22c55e'];
    const chosenColor = colors[Math.floor(Math.random() * colors.length)];
    
    // Create 80-100 particles for a huge burst
    const particleCount = Math.floor(Math.random() * 30) + 70;
    for (let i = 0; i < particleCount; i++) {
      this.particles.push(new Particle(this.x, this.y, chosenColor));
    }
  }
  update() {
    this.particles.forEach((p, index) => {
      p.update();
      if (p.alpha <= 0) {
        this.particles.splice(index, 1);
      }
    });
  }
  draw() {
    this.particles.forEach(p => p.draw());
  }
}

let fireworks = [];

// Click event for manual dhamaka everywhere
window.addEventListener('click', (e) => {
  // Prevent default if clicking inside content box, but still allow fireworks
  fireworks.push(new Firework(e.clientX, e.clientY));
});

// Auto occasional fireworks in sky for lively atmosphere
setInterval(() => {
  if(Math.random() < 0.7) {
    const rx = Math.random() * canvas.width;
    const ry = Math.random() * (canvas.height * 0.6);
    fireworks.push(new Firework(rx, ry));
  }
}, 800);

function animate() {
  ctx.fillStyle = 'rgba(3, 7, 18, 0.2)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  fireworks.forEach((fw, index) => {
    fw.update();
    fw.draw();
    if (fw.particles.length === 0) {
      fireworks.splice(index, 1);
    }
  });

  requestAnimationFrame(animate);
}

animate();
</script>

</body>
</html>
